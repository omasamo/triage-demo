# Builds the desktop installers and attaches them to the GitHub release v<package.json version>.
# Run it from the Actions tab ("Run workflow") or push a tag like v0.1.0.
name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Package (unsigned demo build)
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Triage-Brain-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
      - id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Triage Brain demo v${{ steps.v.outputs.version }}
          body: |
            Unsigned demo installers. Mac: right-click the app and choose Open the first time. Windows: More info, then Run anyway.
            The app starts on the built-in rule engine. Open Settings and click Download Qwen3.5-2B (about 1.5 GB, once) to run the local model.
          files: |
            release/*.dmg
            release/*.exe
